# Overrides of the pinned verl ppo_trainer configuration.
data:
  train_files: ['${oc.env:LFM_ROOT,/path/to/visual_trajectory}/training/streetview_grpo_opsd_qwen3vl8b_lora_v1/train.jsonl']
  val_files: ['${oc.env:LFM_ROOT,/path/to/visual_trajectory}/training/streetview_grpo_opsd_qwen3vl8b_lora_v1/validation_probe.jsonl']
  train_batch_size: 64
  max_prompt_length: 5120
  max_response_length: 3072
  filter_overlong_prompts: false
  truncation: error
  shuffle: true
  seed: 20261009
  dataloader_num_workers: 2
  custom_cls:
    path: ${oc.env:LFM_ROOT,/path/to/visual_trajectory}/code/training/grpo_opsd/streetview_runtime.py
    name: StreetViewDataset
  apply_chat_template_kwargs:
    add_vision_id: false
  mm_processor_kwargs:
    min_pixels: 65536
    max_pixels: 524288
actor_rollout_ref:
  model:
    path: ${oc.env:LFM_ROOT,/path/to/visual_trajectory}/models/streetview_sft_checkpoint500_single_round_bf16
    lora_rank: 64
    lora_alpha: 128
    target_modules: '.*language_model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))$'
    enable_gradient_checkpointing: true
    use_remove_padding: true
    lora:
      dropout: 0.0
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    use_dynamic_bsz: false
    loss_agg_mode: token-mean
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    policy_loss:
      loss_mode: vanilla
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0.0
    data_loader_seed: 20261009
    checkpoint:
      save_lora_only: true
    optim:
      lr: 0.000001
      weight_decay: 0.01
      betas: [0.9, 0.999]
      lr_scheduler_type: constant
      lr_warmup_steps_ratio: 0.0
      clip_grad: 1.0
      override_optimizer_config: {eps: 0.00000001}
    fsdp_config:
      use_orig_params: true
      param_offload: true
      optimizer_offload: true
      model_dtype: fp32
      dtype: bfloat16
      seed: 20261009
      entropy_from_logits_with_chunking: true
      entropy_from_logits_chunk_size: 512
  rollout:
    name: vllm
    load_format: safetensors
    layered_summon: true
    enforce_eager: false
    disable_log_stats: false
    tensor_model_parallel_size: 1
    n: 8
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    seed: 20261009
    max_model_len: 8192
    max_num_batched_tokens: 8192
    max_num_seqs: 16
    gpu_memory_utilization: 0.4
    limit_images: 8
    enable_chunked_prefill: true
    enable_prefix_caching: true
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_use_dynamic_bsz: false
    calculate_log_probs: true
    agent:
      num_workers: 2
      default_agent_loop: streetview_single_turn
      agent_loop_config_path: ${oc.env:LFM_ROOT,/path/to/visual_trajectory}/code/training/grpo_opsd/agent.yaml
      agent_loop_manager_class: streetview_runtime.StreetViewManager
  ref:
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_use_dynamic_bsz: false
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
distillation:
  enabled: true
  n_gpus_per_node: 1
  nnodes: 1
  teacher_models:
    teacher_model:
      model_path: ${actor_rollout_ref.model.path}
      inference:
        name: vllm
        enforce_eager: false
        disable_log_stats: false
        tensor_model_parallel_size: 1
        gpu_memory_utilization: 0.4
        max_model_len: 9216
        prompt_length: 5376
        response_length: 3072
        max_num_batched_tokens: 8192
        max_num_seqs: 8
        limit_images: 8
        enable_chunked_prefill: true
        enable_prefix_caching: true
  distillation_loss:
    loss_mode: k1
    use_policy_gradient: true
    use_task_rewards: true
    distillation_loss_coef: 0.01
    loss_max_clamp: 10.0
    log_prob_min_clamp: null
    policy_loss_mode: vanilla
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
reward:
  num_workers: 2
  custom_reward_function:
    path: ${oc.env:LFM_ROOT,/path/to/visual_trajectory}/code/training/grpo_opsd/streetview_runtime.py
    name: compute_score
trainer:
  use_v1: false
  n_gpus_per_node: 1
  nnodes: 1
  total_epochs: 1
  project_name: streetview_grpo_opsd
  experiment_name: qwen3vl8b_lora_v1
  logger: [console, tensorboard]
  save_freq: 25
  test_freq: -1
  val_before_train: false
  resume_mode: auto
  default_local_dir: ${oc.env:LFM_ROOT,/path/to/visual_trajectory}/runs/streetview_grpo_opsd_qwen3vl8b_lora_v1/training
ray_kwargs:
  ray_init:
    address: local
    num_cpus: 32
    num_gpus: 2
    include_dashboard: false
    _temp_dir: /tmp/streetview_grpo_opsd_ray
    runtime_env:
      py_executable: null
